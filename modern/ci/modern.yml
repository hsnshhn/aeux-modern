name: AEUX Modern
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: aeux-modern-plugins
          path: dist/*.zip
